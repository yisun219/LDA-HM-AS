[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lda-flow"
version = "0.2.0"
description = "E2B-only Humanize2 campaign flow for Ubuntu package optimization"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
  "e2b==2.15.0",
  "hmz @ git+https://github.com/humanfia/humanize2.git@881ddebd46c1580ab20eb5421de938c30314eb82",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.11"]

[project.scripts]
lda-flow = "lda_flow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"templates/**" = ["S603", "S607"]
"src/lda_hm/**" = ["I001", "UP017", "UP035", "UP042"]
"tests/test_flow.py" = ["I001"]
"tests/test_stages.py" = ["I001"]
