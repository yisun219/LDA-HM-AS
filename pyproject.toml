[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-development-agent"
version = "0.1.0"
description = "Evidence-driven Linux package research and optimization flow"
authors = [{name = "yisun219", email = "ecesunyi@gmail.com"}]
requires-python = ">=3.12"
dependencies = ["e2b==2.10.2"]

[project.scripts]
lda = "lda.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
