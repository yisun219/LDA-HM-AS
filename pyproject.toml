[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lda-autoresearch"
version = "0.1.0"
description = "Argus + Humanize LDA autoresearch flow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
lda = "lda.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

