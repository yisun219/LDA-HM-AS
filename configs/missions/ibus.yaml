package: ibus
source_package: ibus
source_version: 1.5.34~rc2-1
binary_packages: [ibus, libibus-1.0-5, libibus-1.0-dev]
runtime_packages: [ibus, libibus-1.0-5, libibus-1.0-dev]
public_header: ibus.h
probe_body: "sink ^= (uintptr_t)ibus_get_address();"
link_libraries: "-libus-1.0"
pkg_config_modules: [ibus-1.0]
layout_body: "printf(\"%zu %zu\\n\",sizeof(IBusRectangle),_Alignof(IBusRectangle));"
ffi_check_command: "candidate=$(dirname $(head -1 /opt/lda/candidate/libraries.list)); LD_LIBRARY_PATH=$candidate /opt/lda/fixtures/generic/probe 100"
ffi_library_pattern: "libibus-1.0.so"
ffi_symbol: "ibus_get_address"
target_functions: [ibus_bus_call_sync, input event processing, candidate lookup]
target_workloads: [desktop typing latency, input method startup, candidate window]
allowed_source_paths: [/opt/lda/work/src, /opt/lda/work/bus, /opt/lda/work/debian/rules]
forbidden_paths: [/opt/lda/work/tests]
abi_manifest: manifests/ibus/abi.json
api_manifest: manifests/ibus/api.json
ffi_manifest: manifests/ibus/ffi.json
microbench_manifest: manifests/ibus/micro.json
e2e_manifest: manifests/ibus/e2e.json
self_tests: [dpkg-buildpackage upstream test target]
reverse_dependency_tests: [gnome-shell, ibus-gtk3]
candidate_budget: 8
acceptance_policy: ABI/D-Bus/input correctness fences pass first; paired micro CI lower >= 1.01; no E2E regression over 0.5 percent.
