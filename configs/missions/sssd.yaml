package: sssd-common
source_package: sssd
source_version: 2.12.0-1ubuntu5
binary_packages: [sssd-common]
runtime_packages: [sssd-common]
public_header: dlfcn.h
probe_body: "void *h=dlopen(\"libsss_util.so\",RTLD_LAZY|RTLD_LOCAL); sink ^= (uintptr_t)h; if(h) dlclose(h);"
link_libraries: "-ldl"
layout_body: "printf(\"opaque\\n\");"
ffi_check_command: "candidate=$(dirname $(head -1 /opt/lda/candidate/libraries.list)); LD_LIBRARY_PATH=$candidate /opt/lda/fixtures/generic/probe 10"
ffi_library_pattern: "libsss_util.so"
ffi_symbol: "sss_strerror"
target_functions: [NSS lookup, cache lookup, LDAP response handling]
target_workloads: [identity lookup, login authentication, directory cache]
allowed_source_paths: [/opt/lda/work/src, /opt/lda/work/debian/rules]
forbidden_paths: [/opt/lda/work/src/tests, /opt/lda/work/debian/tests]
abi_manifest: manifests/sssd/abi.json
api_manifest: manifests/sssd/api.json
ffi_manifest: manifests/sssd/ffi.json
microbench_manifest: manifests/sssd/micro.json
e2e_manifest: manifests/sssd/e2e.json
self_tests: [dpkg-buildpackage upstream test target]
reverse_dependency_tests: [libnss-sss, libpam-sss]
candidate_budget: 8
acceptance_policy: ABI/NSS/PAM behavior fences pass first; paired micro CI lower >= 1.01; no E2E regression over 0.5 percent.
