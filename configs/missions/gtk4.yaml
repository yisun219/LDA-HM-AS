package: libgtk-4-1
source_package: gtk4
source_version: 4.22.2+ds-1ubuntu1
binary_packages: [libgtk-4-1, libgtk-4-dev]
runtime_packages: [libgtk-4-1, libgtk-4-dev]
public_header: gtk/gtk.h
probe_body: "sink ^= (uintptr_t)gtk_get_major_version();"
link_libraries: "-lgtk-4"
pkg_config_modules: [gtk4]
layout_body: "printf(\"%zu %zu\\n\",sizeof(GtkBorder),_Alignof(GtkBorder));"
ffi_check_command: "candidate=$(dirname $(head -1 /opt/lda/candidate/libraries.list)); LD_LIBRARY_PATH=$candidate /opt/lda/fixtures/generic/probe 100"
target_functions: [gtk_snapshot_append_node, gtk_widget_snapshot, gsk_renderer_render]
target_workloads: [GTK4 rendering, Chromium integration, desktop applications]
allowed_source_paths: [/opt/lda/work/gtk, /opt/lda/work/gdk, /opt/lda/work/gsk, /opt/lda/work/debian/rules]
forbidden_paths: [/opt/lda/work/testsuite, /opt/lda/work/tests]
abi_manifest: manifests/gtk4/abi.json
api_manifest: manifests/gtk4/api.json
ffi_manifest: manifests/gtk4/ffi.json
microbench_manifest: manifests/gtk4/micro.json
e2e_manifest: manifests/gtk4/e2e.json
self_tests: [dpkg-buildpackage upstream test target]
reverse_dependency_tests: [gnome-shell, libadwaita-1-0]
candidate_budget: 8
acceptance_policy: ABI/API/FFI pass first; paired micro CI lower >= 1.01; no E2E regression over 0.5 percent.
