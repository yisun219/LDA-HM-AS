package: libsoup-3.0-0
source_package: libsoup3
source_version: 3.6.6-1
binary_packages: [libsoup-3.0-0, libsoup-3.0-dev]
runtime_packages: [libsoup-3.0-0, libsoup-3.0-dev]
public_header: libsoup/soup-headers.h
probe_body: "const char request[]=\"GET / HTTP/1.1\\r\\nHost: example\\r\\n\\r\\n\"; SoupMessageHeaders *h=soup_message_headers_new(SOUP_MESSAGE_HEADERS_REQUEST); int r=(int)soup_headers_parse_request(request,sizeof(request)-1,h,0,0,0); soup_message_headers_unref(h); sink ^= (uintptr_t)r;"
link_libraries: "-lsoup-3.0"
pkg_config_modules: [libsoup-3.0]
layout_body: "printf(\"opaque\\n\");"
ffi_check_command: "candidate=$(dirname $(head -1 /opt/lda/candidate/libraries.list)); LD_LIBRARY_PATH=$candidate /opt/lda/fixtures/libsoup-header-bench 100"
target_functions: [soup_headers_parse_request, soup_headers_parse, soup_message_headers_append]
target_workloads: [HTTP request parsing, local web server, GNOME network clients]
seed_hypotheses:
  - candidate_id: libsoup-toolchain-flags
    target: Debian package compiler and linker flags for libsoup hot paths
    mechanism: Add -O3 -fno-semantic-interposition -fno-plt -mtune=skylake-avx512 -falign-functions=32 -falign-loops=32 without using -march=native or changing public interfaces.
    expected_effect: Revalidate the previously observed header parsing and local HTTP request speedup on Xeon Gold 6548Y+.
    risks: [toolchain-sensitive code generation, code-size growth, performance regression on non-target CPUs]
    validation: [ABI/API/FFI fence, paired header microbenchmark, local HTTP E2E, package install and rollback]
allowed_source_paths: [/opt/lda/work/libsoup, /opt/lda/work/debian/rules, /opt/lda/work/perf]
forbidden_paths: [/opt/lda/work/tests, /opt/lda/work/fixtures]
abi_manifest: manifests/libsoup/abi.json
api_manifest: manifests/libsoup/api.json
ffi_manifest: manifests/libsoup/ffi.json
microbench_manifest: manifests/libsoup/micro.json
e2e_manifest: manifests/libsoup/e2e.json
extra_baseline_commands:
  - [/opt/lda/harness/checks/prepare-libsoup-e2e.sh]
e2e_benchmark_command: [/opt/lda/harness/checks/run-paired-libsoup-e2e.py]
self_tests: [dpkg-buildpackage upstream test target]
reverse_dependency_tests: [gnome-online-accounts]
candidate_budget: 8
acceptance_policy: ABI/API/FFI pass first; paired micro CI lower >= 1.01; no E2E regression over 0.5 percent.
